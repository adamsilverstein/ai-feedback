<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Fresh Eyes">
  <style>
    /* Still for about 15 seconds, then a quick blink. */
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 15s infinite; }
    @keyframes blink {
      0%, 97%, 100% { transform: scaleY(1); }
      98.5% { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .eye { animation: none; }
    }
  </style>
  <circle cx="48" cy="48" r="45" fill="#1e1b4b" stroke="white" stroke-width="2" />
  <g class="eye">
    <ellipse cx="32" cy="48" rx="13" ry="16" fill="white" />
    <circle cx="35" cy="50" r="6.5" fill="#1e1b4b" />
    <circle cx="37" cy="47" r="2" fill="white" />
  </g>
  <g class="eye">
    <ellipse cx="64" cy="48" rx="13" ry="16" fill="white" />
    <circle cx="67" cy="50" r="6.5" fill="#1e1b4b" />
    <circle cx="69" cy="47" r="2" fill="white" />
  </g>
  <path d="M74 16 C76 22 78 24 84 26 C78 28 76 30 74 36 C72 30 70 28 64 26 C70 24 72 22 74 16 Z" fill="#fb923c" />
</svg>
