version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # @wordpress/* packages share private APIs and break when bumped one at a time.
      wordpress:
        applies-to: version-updates
        patterns:
          - "@wordpress/*"
      wordpress-security:
        applies-to: security-updates
        patterns:
          - "@wordpress/*"
      npm:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        applies-to: version-updates
        patterns:
          - "*"
      composer-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
